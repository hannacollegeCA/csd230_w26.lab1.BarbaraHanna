<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book List</title>
</head>
<body>
<h1>Book List</h1>

<!--
    Table showing all books from the database.
    The controller sends a list called "books" to this page.
-->

<table border="1">
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Copies</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>

    <!-- Loop through each book and display its data -->
    <tr th:each="book : ${books}">
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.price}"></td>
        <td th:text="${book.copies}"></td>
        <td>

            <!-- Link to view details of the selected book -->
            <a th:href="@{/books/{id}(id=${book.id})}">Details</a>

            <!-- Link to edit the selected book -->
            <a th:href="@{/books/edit/{id}(id=${book.id})}">Edit</a>

            <!-- Link to delete the selected book -->
            <a th:href="@{/books/delete/{id}(id=${book.id})}">Delete</a>

            <a th:href="@{/cart/add/{id}(id=${book.id})}">Add to Cart</a>

        </td>
    </tr>
    </tbody>
</table>

<br/>
<a th:href="@{/books/add}">Add New Book</a>

<a th:href="@{/cart}">View Cart</a>

</body>
</html>
