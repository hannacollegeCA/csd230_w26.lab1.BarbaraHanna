<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Book List</title>
</head>
<body>
<h1>Book List</h1>

<!--
    Table showing all books from the database.
    The controller sends a list called "books" to this page.
-->

<!-- Show logged-in username -->
<p>Logged in as: <span sec:authentication="name"></span></p>

<!-- Logout button -->
<form th:action="@{/logout}" method="post">
    <button type="submit">Sign Out</button>
</form>

<br/>

<table border="1">
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Copies</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>

    <!-- Loop through each book and display its data -->
    <tr th:each="book : ${books}">
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.price}"></td>
        <td th:text="${book.copies}"></td>
        <td>

            <!-- Link to view details of the selected book -->
            <a th:href="@{/books/{id}(id=${book.id})}">Details</a>

            <!-- Only ADMIN can edit/delete -->
            <span sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/books/edit/{id}(id=${book.id})}">Edit</a>
            <a th:href="@{/books/delete/{id}(id=${book.id})}">Delete</a>
            </span>

            <!-- Only USER can add to cart -->
            <span sec:authorize="hasRole('USER')">
            <a th:href="@{/cart/add/{id}(id=${book.id})}">Add to Cart</a>
            </span>

        </td>
    </tr>
    </tbody>
</table>

<br/>
<!-- Only ADMIN can add new books -->
<span sec:authorize="hasRole('ADMIN')">
<a th:href="@{/books/add}">Add New Book</a>
</span>

<!-- Only USER can view cart -->
<span sec:authorize="hasRole('USER')">
<a th:href="@{/cart}">View Cart</a>
    </span>

</body>
</html>
