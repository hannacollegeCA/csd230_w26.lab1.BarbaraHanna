<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
</head>
<body>

<h1>Register New User</h1>

<!-- Registration form bound to a UserEntity object -->
<form th:action="@{/register}" th:object="${user}" method="post">

    <!-- Username input -->
    <div>
        <label>Username: <input type="text" th:field="*{username}" required/></label>
    </div>

    <!-- Password input -->
    <div>
        <label>Password: <input type="password" th:field="*{password}" required/></label>
    </div>

    <!-- Submit button -->
    <div>
        <button type="submit">Register</button>
    </div>
</form>

<br/>
<!-- Link back to login page -->
<a th:href="@{/login}">Back to Login</a>

</body>
</html>
