<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Confirmation</title>
</head>
<body>

<h1>Order Confirmation</h1>

<p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
<p><strong>Date:</strong> <span th:text="${order.orderDate}"></span></p>
<p><strong>Total:</strong> $<span th:text="${order.totalAmount}"></span></p>

<h2>Items Purchased</h2>

<ul>
    <li th:each="p : ${order.products}">
        <span th:text="${p.title}"></span> - $<span th:text="${p.price}"></span>
    </li>
</ul>

<a th:href="@{/books}">Back to Store</a>

</body>
</html>
